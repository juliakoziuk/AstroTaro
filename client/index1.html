<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071525">
  <title>MYSTIQ — Discover your inner universe</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #071525;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    /*
      Pixel-faithful reference rendering:
      the original artwork contains intricate ornamental linework,
      lighting, textures, lettering and tiny decorative details.
      Keeping it as one image preserves those details exactly.
    */
    .landing {
      width: min(100%, 1024px);
      line-height: 0;
      overflow: hidden;
      background: var(--page-bg);
    }

    .landing img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* On very wide screens, keep the reference at its original scale. */
    @media (min-width: 1025px) {
      body { padding-top: 0; }
    }
  </style>
</head>
<body>
  <main class="landing" aria-label="MYSTIQ — головна сторінка">
    <img
      src="assets/mystiq-landing-reference.jpg"
      alt="MYSTIQ — Discover your inner universe. Tarot, dream journal, astrology and AI assistant."
      width="1024"
      height="642"
    >
  </main>
</body>
</html>
