name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (lint, i18n, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  server:
    name: Server (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # swagger очікує TypeScript 5–6, у проєкті 7 (див. server/README.md)
      - run: npm ci --legacy-peer-deps
      # tsc + node --test: юніт-тести чистої логіки, база даних не потрібна
      - run: npm test

  migrations:
    name: API (migrations and end-to-end tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: AstroTarot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: AstroTarot
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: node scripts/migrate.mjs
      # повторний запуск нічого не застосовує: міграції можна запускати на кожному деплої
      - run: node scripts/migrate.mjs | grep -q 'Nothing to apply'
      # HTTP-шар проти справжньої бази: вхід, права доступу, чужі записи, тарифи, ліміти (окрема база AstroTarot_test)
      - run: npm run test:e2e
